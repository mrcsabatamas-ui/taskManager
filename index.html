<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Tasks</title>
  <style>
    /* Reset and base styles */
    body {
      background-color: #f0f0f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      color: #333;
    }

    /* Flat paper design container */
    .paper-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 600px;
      min-height: 80vh;
      padding: 40px;
      border: 1px solid #e0e0e0;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.05); 
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      border-bottom: 2px solid #f0f0f5;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    /* Task input field */
    .task-input {
      width: 100%;
      padding: 12px;
      border: none;
      border-bottom: 2px dashed #ccc;
      font-size: 16px;
      outline: none;
      background: transparent;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    .task-input:focus {
      border-bottom-color: #888;
    }

    /* Simple list styling */
    .task-list {
      list-style-type: none;
      padding: 0;
    }

    .task-item {
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f5;
      display: flex;
      justify-content: space-between; 
      align-items: center;
    }

    /* NEW: Container to group the checkbox and text together */
    .task-content {
      display: flex;
      align-items: center;
      gap: 12px; /* Adds space between checkbox and text */
    }

    /* NEW: Styling for the checkbox */
    .task-checkbox {
      cursor: pointer;
      width: 18px;
      height: 18px;
      accent-color: #333; /* Makes the checked state dark instead of default blue */
    }

    /* NEW: Class applied when a task is marked done */
    .completed-text {
      text-decoration: line-through;
      color: #aaa;
    }

    /* Subtle delete button */
    .delete-btn {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 18px;
      transition: color 0.2s;
    }

    .delete-btn:hover {
      color: #ff4757;
    }
  </style>
</head>
<body>

  <div class="paper-container">
    <h1>My Tasks</h1>
    <input type="text" class="task-input" id="newTaskInput" placeholder="Write a new task and press Enter...">
    
    <ul class="task-list" id="taskList">
      </ul>
  </div>

  <script type="module">
    // 1. Import the specific Firebase tools we need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    // NEW: We added 'updateDoc' to this list so we can modify existing tasks
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, updateDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    // 2. Your exact Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC07blTJY22zHAGhhu4fxQjYTf1Oy06YEI",
      authDomain: "paper-tasks.firebaseapp.com",
      projectId: "paper-tasks",
      storageBucket: "paper-tasks.firebasestorage.app",
      messagingSenderId: "1089128460895",
      appId: "1:1089128460895:web:ed3d5ab4a44df3777e61ea"
    };

    // 3. Initialize Firebase and Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Grab the UI elements from the page
    const taskInput = document.getElementById('newTaskInput');
    const taskList = document.getElementById('taskList');

    const tasksCollection = collection(db, 'tasks');
    const tasksQuery = query(tasksCollection, orderBy('createdAt', 'desc'));

    // --- FEATURE 1: Read and Display Tasks in Real-time ---
    onSnapshot(tasksQuery, (snapshot) => {
      taskList.innerHTML = ''; 

      snapshot.forEach((docSnap) => {
        const taskData = docSnap.data();
        const taskId = docSnap.id;
        
        // NEW: Check if task is completed. (Defaults to false if it's an old task that doesn't have this property yet)
        const isCompleted = taskData.completed || false;
        
        const li = document.createElement('li');
        li.className = 'task-item';

        // NEW: Create a wrapper for the checkbox and text
        const contentDiv = document.createElement('div');
        contentDiv.className = 'task-content';
        
        // NEW: Create the checkbox
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'task-checkbox';
        checkbox.checked = isCompleted; // Check the box if the database says it's done
        // When clicked, trigger the toggle function
        checkbox.onchange = () => toggleTaskCompletion(taskId, isCompleted);
        
        const span = document.createElement('span');
        span.textContent = taskData.text;
        
        // NEW: If completed, add the strikethrough CSS class
        if (isCompleted) {
          span.classList.add('completed-text');
        }
        
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.innerHTML = '&times;'; 
        deleteBtn.onclick = () => deleteTask(taskId); 
        
        // Assemble the pieces
        contentDiv.appendChild(checkbox);
        contentDiv.appendChild(span);
        li.appendChild(contentDiv);
        li.appendChild(deleteBtn);
        taskList.appendChild(li);
      });
    });

    // --- FEATURE 2: Add a New Task ---
    taskInput.addEventListener('keypress', async (e) => {
      if (e.key === 'Enter' && taskInput.value.trim() !== '') {
        const taskText = taskInput.value.trim();
        taskInput.value = ''; 
        
        try {
          await addDoc(tasksCollection, {
            text: taskText,
            completed: false, // NEW: All new tasks start as incomplete
            createdAt: serverTimestamp() 
          });
        } catch (error) {
          console.error("Error adding task: ", error);
        }
      }
    });

    // --- FEATURE 3: Toggle Task Completion ---
    // NEW FUNCTION: Updates the database when you click the checkbox
    async function toggleTaskCompletion(id, currentStatus) {
      try {
        const taskRef = doc(db, 'tasks', id);
        // We set completed to be the opposite (!currentStatus) of whatever it is right now
        await updateDoc(taskRef, {
          completed: !currentStatus
        });
      } catch (error) {
        console.error("Error updating task: ", error);
      }
    }

    // --- FEATURE 4: Delete a Task ---
    async function deleteTask(id) {
      try {
        await deleteDoc(doc(db, 'tasks', id));
      } catch (error) {
        console.error("Error deleting task: ", error);
      }
    }
  </script>
</body>
</html>
