<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Tasks</title>
  <style>
    /* Reset and base styles */
    body {
      background-color: #f0f0f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      color: #333;
    }

    /* Flat paper design container */
    .paper-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 600px;
      min-height: 80vh;
      padding: 40px;
      border: 1px solid #e0e0e0;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.05); 
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      border-bottom: 2px solid #f0f0f5;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    /* Task input field */
    .task-input {
      width: 100%;
      padding: 12px;
      border: none;
      border-bottom: 2px dashed #ccc;
      font-size: 16px;
      outline: none;
      background: transparent;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    .task-input:focus {
      border-bottom-color: #888;
    }

    /* Simple list styling */
    .task-list {
      list-style-type: none;
      padding: 0;
    }

    .task-item {
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f5;
      display: flex;
      justify-content: space-between; 
      align-items: center;
    }

    .task-content {
      display: flex;
      align-items: center;
      gap: 12px; 
    }

    .task-checkbox {
      cursor: pointer;
      width: 18px;
      height: 18px;
      accent-color: #333; 
    }

    .completed-text {
      text-decoration: line-through;
      color: #aaa;
    }

    /* NEW: Container to group the edit and delete buttons together */
    .task-actions {
      display: flex;
      gap: 8px;
    }

    /* NEW: Shared styling for both action buttons */
    .action-btn {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 18px;
      transition: color 0.2s;
    }

    /* NEW: Specific hover colors for edit vs delete */
    .edit-btn:hover {
      color: #57a1ff; /* Turns blue on hover */
    }

    .delete-btn:hover {
      color: #ff4757; /* Turns red on hover */
    }
  </style>
</head>
<body>

  <div class="paper-container">
    <h1>My Tasks</h1>
    <input type="text" class="task-input" id="newTaskInput" placeholder="Write a new task and press Enter...">
    
    <ul class="task-list" id="taskList">
      </ul>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, updateDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC07blTJY22zHAGhhu4fxQjYTf1Oy06YEI",
      authDomain: "paper-tasks.firebaseapp.com",
      projectId: "paper-tasks",
      storageBucket: "paper-tasks.firebasestorage.app",
      messagingSenderId: "1089128460895",
      appId: "1:1089128460895:web:ed3d5ab4a44df3777e61ea"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const taskInput = document.getElementById('newTaskInput');
    const taskList = document.getElementById('taskList');

    const tasksCollection = collection(db, 'tasks');
    const tasksQuery = query(tasksCollection, orderBy('createdAt', 'desc'));

    // --- FEATURE 1: Read and Display Tasks in Real-time ---
    onSnapshot(tasksQuery, (snapshot) => {
      taskList.innerHTML = ''; 

      snapshot.forEach((docSnap) => {
        const taskData = docSnap.data();
        const taskId = docSnap.id;
        const isCompleted = taskData.completed || false;
        
        const li = document.createElement('li');
        li.className = 'task-item';

        const contentDiv = document.createElement('div');
        contentDiv.className = 'task-content';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'task-checkbox';
        checkbox.checked = isCompleted; 
        checkbox.onchange = () => toggleTaskCompletion(taskId, isCompleted);
        
        const span = document.createElement('span');
        span.textContent = taskData.text;
        if (isCompleted) {
          span.classList.add('completed-text');
        }
        
        // NEW: Create a wrapper for our buttons
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'task-actions';

        // NEW: Create the Edit button
        const editBtn = document.createElement('button');
        editBtn.className = 'action-btn edit-btn';
        editBtn.innerHTML = '&#9998;'; // This is the HTML code for a nice pencil icon (✎)
        editBtn.onclick = () => editTask(taskId, taskData.text);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'action-btn delete-btn';
        deleteBtn.innerHTML = '&times;'; 
        deleteBtn.onclick = () => deleteTask(taskId); 
        
        // Assemble the pieces
        contentDiv.appendChild(checkbox);
        contentDiv.appendChild(span);
        
        // NEW: Put both buttons into the actions container
        actionsDiv.appendChild(editBtn);
        actionsDiv.appendChild(deleteBtn);

        li.appendChild(contentDiv);
        li.appendChild(actionsDiv); // Put the actions container on the right side of the list item
        taskList.appendChild(li);
      });
    });

    // --- FEATURE 2: Add a New Task ---
    taskInput.addEventListener('keypress', async (e) => {
      if (e.key === 'Enter' && taskInput.value.trim() !== '') {
        const taskText = taskInput.value.trim();
        taskInput.value = ''; 
        
        try {
          await addDoc(tasksCollection, {
            text: taskText,
            completed: false, 
            createdAt: serverTimestamp() 
          });
        } catch (error) {
          console.error("Error adding task: ", error);
        }
      }
    });

    // --- FEATURE 3: Toggle Task Completion ---
    async function toggleTaskCompletion(id, currentStatus) {
      try {
        const taskRef = doc(db, 'tasks', id);
        await updateDoc(taskRef, {
          completed: !currentStatus
        });
      } catch (error) {
        console.error("Error updating task: ", error);
      }
    }

    // --- FEATURE 4: Edit a Task (NEW) ---
    async function editTask(id, currentText) {
      // Open a browser prompt pre-filled with the current text
      const newText = prompt("Edit your task:", currentText);
      
      // Only save if the user typed something new and didn't hit 'Cancel'
      if (newText !== null && newText.trim() !== "" && newText !== currentText) {
        try {
          const taskRef = doc(db, 'tasks', id);
          // Update just the 'text' property in Firestore
          await updateDoc(taskRef, {
            text: newText.trim()
          });
        } catch (error) {
          console.error("Error editing task: ", error);
        }
      }
    }

    // --- FEATURE 5: Delete a Task ---
    async function deleteTask(id) {
      try {
        await deleteDoc(doc(db, 'tasks', id));
      } catch (error) {
        console.error("Error deleting task: ", error);
      }
    }
  </script>
</body>
</html>
